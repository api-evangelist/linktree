# Arbor — Linktree's public design system and component registry.
generated: '2026-08-13'
method: searched
source: https://arbor.linktr.ee/manifest.json
docs: https://arbor.linktr.ee/
llms_txt: https://arbor.linktr.ee/llms.txt
ownership:
  confirmed: true
  evidence: >-
    manifest.json declares metadata.maintainer "Linktree", repository
    github.com/blstrco/arbor (blstrco is Linktree's GitHub org — the page title on
    github.com/blstrco is "Linktree · GitHub"), package name @linktr.ee/arbor, and the whole
    registry is served from arbor.linktr.ee, a subdomain of Linktree's own apex.
note: >-
  This is a genuinely distinct surface from the MCP server: Arbor is an anonymous, unauthenticated,
  machine-readable HTTP registry. It is the only Linktree programmatic surface an agent can call
  today with no credentials at all. Components are NOT shipped as an npm dependency — the shadcn
  CLI fetches each component's JSON and writes the TypeScript source into the consumer's project,
  so there is no runtime dependency or version lock-in.
registry:
  name: Arbor Design System
  package: "@linktr.ee/arbor"
  version: 26.0.1
  protocol_version: '1.0'
  schema: https://ui.shadcn.com/schema/registry.json
  item_schema: https://ui.shadcn.com/schema/registry-item.json
  distribution: shadcn-registry
  runtime_dependency: false
  capabilities:
    components: true
endpoints:
  - path: /manifest.json
    url: https://arbor.linktr.ee/manifest.json
    method: GET
    auth: none
    status: 200
    content_type: application/json
    description: Full registry manifest with all component metadata.
  - path: /r/registry.json
    url: https://arbor.linktr.ee/r/registry.json
    method: GET
    auth: none
    status: 200
    description: shadcn registry document (also served at /registry.json).
  - path: "/r/{name}.json"
    url: https://arbor.linktr.ee/r/button.json
    method: GET
    auth: none
    status: 200
    description: Individual component definition — files, dependencies, registryDependencies.
  - path: /health
    url: https://arbor.linktr.ee/health
    method: GET
    auth: none
    status: 200
    description: Service health status.
    observed_body: '{"status":"healthy","service":"Arbor Registry Server","version":"1.0.0"}'
install:
  prerequisites:
    - Node.js >= 20 (required by the shadcn CLI)
    - React 18+ project with Tailwind CSS v3.4+
  register_registry: |
    {
      "registries": {
        "@arbor": "https://arbor.linktr.ee/r/{name}.json"
      }
    }
  bootstrap: npx shadcn@latest add @arbor/setup
  add_component: npx shadcn@latest add @arbor/button
  wiring:
    - "import '@/styles/arbor.css' in the root layout"
    - "add ./config/arbor-tailwind-preset to presets[] in tailwind.config.ts"
  manual_fallback: >-
    curl https://arbor.linktr.ee/r/button.json and copy each file's `content` to its `path`,
    then install the listed `dependencies` and repeat for each `registryDependencies` entry.
stack:
  - TypeScript
  - React 18+
  - Tailwind CSS v3.4+
  - Radix UI
  - Base UI
  - "@phosphor-icons/react"
  - Sonner
  - input-otp
