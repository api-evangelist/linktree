lifecycle:
  status_field: meta.intention.status
  shipped: 45
  deprecated: 3
  unstated: 3
  deprecated_items:
    - name: dialog
      reason: >-
        Older modal anatomy; maintain or migrate existing usage only. Route destructive
        confirmations to AlertDialog.
    - name: radio-group
      reason: >-
        Deprecated alias of `radio`, kept so `npx shadcn add radio-group` keeps resolving during
        the rename window.
      removal_version: 16.0.0
    - name: popover
      reason: >-
        Shipped without an approved design (ticket DS-290); do not use for new UI. Route to
        RichTooltip or Menu.
  note: >-
    Arbor publishes machine-readable per-component deprecation status with migration guidance,
    and in one case a named removal version. This is real deprecation signalling on a public
    surface — but it is component-level metadata, not a published API deprecation POLICY, so no
    Deprecation pointer is claimed for it. See lifecycle/linktree-lifecycle.yml.
mcp:
  server: "@linktr.ee/arbor-mcp"
  transport: stdio
  install: npx -y @linktr.ee/arbor-mcp
  tools_theme: Playroom snippets, Figma-to-code sync health, UX-writing checks
  see: mcp/linktree-mcp.yml
  note: >-
    Arbor's own llms.txt additionally suggests wiring the generic `npx shadcn@latest mcp` server
    to browse the registry, which is a third-party server, not Linktree's.
other_component_libraries:
  - name: "@linktr.ee/ui-link-kit"
    registry: npm
    version: 0.0.59
    published: '2023-06-26'
    status: stale
    note: Predecessor UI kit for custom links; superseded in practice by Arbor.
  - name: "@linktr.ee/messaging-react"
    registry: npm
    version: 4.0.4
    published: '2026-08-11'
    status: active
    note: React messaging components built on messaging-core.
  - name: "@linktr.ee/registry"
    registry: npm
    version: 0.0.9
    published: '2025-11-20'
    note: Component registry for LinkApps (the Marketplace app format), distinct from Arbor.
files:
  - path: components/linktree-arbor-registry-manifest.json
    source: https://arbor.linktr.ee/manifest.json
    verbatim: true
  - path: llms/linktree-arbor-llms.txt
    source: https://arbor.linktr.ee/llms.txt
    verbatim: true
spec:
  openapi_published: false
  note: >-
    /openapi.json, /api-docs and /.well-known/* all return the registry's own 404 page. The
    registry is schema-described (shadcn registry + registry-item JSON Schemas) but has no
    OpenAPI description of its four HTTP endpoints.
