- host: https://arbor.linktr.ee
  added: '2026-08-13'
  note: >-
    The public Arbor component registry. Serves a real machine-readable API surface
    (/manifest.json, /r/{name}.json, /health, /llms.txt) but nothing under /.well-known/ —
    every path below returns the registry's own styled 404 HTML page, not an SPA soft-200.
  documents:
  - path: /.well-known/security.txt
    status: 404
  - path: /.well-known/openid-configuration
    status: 404
  - path: /.well-known/oauth-authorization-server
    status: 404
