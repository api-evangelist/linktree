agent_card:
  present: false
  checked: '2026-08-13'
  paths: [/.well-known/agent-card.json, /.well-known/agent.json]
  hosts: [linktr.ee, mcp.linktr.ee, arbor.linktr.ee, api.linktr.ee]
  results: 404 on linktr.ee, mcp.linktr.ee and arbor.linktr.ee; 503 on api.linktr.ee
  note: >-
    No A2A agent card is served on any Linktree host. Per pipeline rule this artifact is never
    generated or derived, so no a2a/ directory exists and no AgentCard pointer is claimed. The
    negative probe is recorded here as data. Note that linktr.ee returns its branded HTML 404
    page (a real 404, not an SPA soft-200), so this is a genuine absence rather than an
    undetectable catch-all.
security_txt:
  present: false
  checked: [https://linktr.ee/.well-known/security.txt, https://mcp.linktr.ee/.well-known/security.txt]
  note: >-
    Linktree runs a public bug bounty on Bugcrowd but does not publish an RFC 9116 security.txt.
    See security/linktree-vulnerability-disclosure.yml.
