generated: '2026-07-19'
method: searched
source: live probes of the /.well-known/ surface on each Linktree host
note: >-
  Linktree publishes an RFC 9727 api-catalog linkset whose single anchor is the MCP endpoint —
  the api-catalog is how the MCP server is discoverable from the apex domain. There is no
  security.txt on any host.
hosts:
