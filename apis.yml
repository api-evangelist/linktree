aid: linktree

name: Linktree

description: Linktree is the link-in-bio platform used by 70M+ creators, brands, and businesses to share everything they create, curate, and sell
  from a single URL. Operated by Linktree Pty Ltd from Collingwood, Victoria, Australia, the product builds a mobile-friendly landing page that
  aggregates social profiles, content, products, and services behind one link, with paid Starter, Pro, and Premium plans adding customization,
  analytics, commerce, scheduling, and AI features. Linktree publishes no general-purpose public REST API — its developer program is an expression-of-interest
  waitlist for forthcoming APIs and SDKs. It documents a LinkApp SDK for building custom LinkApps at docs.linktr.ee, and it does, however, run
  a live, fully documented OAuth 2.0-protected Model Context Protocol server at mcp.linktr.ee exposing 30 tools for managing profiles, links,
  collections, appearance, social icons, workspaces, and analytics, discoverable from an RFC 9727 api-catalog on the apex domain. Alongside it
  Linktree operates Arbor, a public unauthenticated component registry at arbor.linktr.ee serving a versioned JSON manifest of 51 React components
  plus a health endpoint and an llms.txt, and it ships first-party developer tooling on npm under the @linktr.ee scope — the LinkApps scaffold/build/deploy
  CLIs and a stdio Arbor MCP server.

