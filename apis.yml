apis:
- aid: linktree-mcp
  name: Linktree MCP
  description: >-
    OAuth 2.0-protected Model Context Protocol server, speaking streamable-http, that lets agents
    manage Linktree profiles, links, collections, appearance, social icon links, workspaces, and
    analytics. Thirty tools, each gated by its own mcp:<tool_name> scope, with write and
    destructive tools flagged for client-side user approval. This is Linktree's only live
    programmatic surface — there is no public REST API.
