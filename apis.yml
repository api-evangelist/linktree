- aid: linktree-arbor-registry
  name: Linktree Arbor Registry
  description: >-
    Arbor is Linktree's design system, published as a public HTTP component registry. Anonymous,
    unauthenticated GETs return a versioned JSON manifest of 51 React components (/manifest.json,
    registry version 26.0.1), individual component definitions at /r/{name}.json following the
    shadcn registry-item schema, and a /health endpoint. It is the only Linktree programmatic
    surface an agent can call today with no credentials. Components are installed as source via
    the shadcn CLI rather than as an npm dependency, so consumers take no runtime lock-in. No
    OpenAPI is published for its four endpoints.
  humanURL: https://arbor.linktr.ee/
  baseURL: https://arbor.linktr.ee
