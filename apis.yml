- aid: linktree:linktree-arbor-registry
  name: Linktree Arbor Registry
  description: Arbor is Linktree's design system, published as a public HTTP component registry. Anonymous, unauthenticated GETs return a versioned
    JSON manifest of 51 React components (/manifest.json, registry version 26.0.1), individual component definitions at /r/{name}.json following
    the shadcn registry-item schema, and a /health endpoint. It is the only Linktree programmatic surface an agent can call today with no credentials.
    Components are installed as source via the shadcn CLI rather than as an npm dependency, so consumers take no runtime lock-in. No OpenAPI is
    published for its four endpoints. As of 2026-10-20 every arbor.linktr.ee path (/, /manifest.json, /health) answers 302 to a GitHub Pages sign-in,
    so the registry is no longer anonymously reachable, and the github.com/blstrco/arbor source repo returns 404.
  humanURL: https://arbor.linktr.ee/
  baseURL: https://arbor.linktr.ee
  tags:
  - Design Systems
  - Components
  - Developer Tools
  - Registry
  tags_raw:
  - Design System
  - Components
  - Developer Tools
  - Registry
