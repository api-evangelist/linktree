  - type: LLMsTxt
    url: llms/linktree-arbor-llms.txt
  - type: Registry
    url: https://arbor.linktr.ee/manifest.json
- name: Linktree LinkApps SDK
  description: Developer documentation at docs.linktr.ee for building custom LinkApps, the embeddable apps that appear on Linktree profiles, using
    the @linktr.ee/linkapp CLI (create, add, dev, build, deploy, login, logout, test-url-match-rules), a manifest/settings configuration model,
    layouts and URL-matching rules. It is an SDK and CLI workflow rather than an HTTP API; the docs (llms-full.txt, read 2026-10-20) state no
    REST base URL and name no HTTP METHOD + path operations, and no OpenAPI is published (docs.linktr.ee/openapi.json and /openapi.yaml return
    404).
  humanURL: https://docs.linktr.ee/
