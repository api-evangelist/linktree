# First-party Linktree client libraries and developer tooling.
generated: '2026-08-13'
method: searched
source: https://registry.npmjs.org/-/v1/search?text=linktr.ee
note: >-
  Linktree publishes no client SDK for the MCP server — the MCP endpoint is consumed by any
  MCP client, so there is nothing to wrap. What it DOES publish, under the first-party npm
  scope @linktr.ee, is the LinkApps developer toolchain (build/deploy tooling for the
  Marketplace link-app format) and the Arbor design system registry + MCP server. Ownership is
  confirmed on two independent signals: the scope name is Linktree's own domain, and the
  packages that declare a repository point at github.com/blstrco — the GitHub org whose page
  title is "Linktree · GitHub" (blstrco is Linktree's original corporate name). @linktr.ee/arbor-mcp
  additionally declares homepage https://arbor.linktr.ee.
