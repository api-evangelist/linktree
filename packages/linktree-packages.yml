distribution_not_on_a_registry:
  - name: Arbor design system components
    registry: http-registry
    url: https://arbor.linktr.ee/r/{name}.json
    manifest: https://arbor.linktr.ee/manifest.json
    version: 26.0.1
    published: null
    note: >-
      Arbor components are NOT distributed as an npm package — they are installed as source
      via the shadcn CLI from an HTTP registry (`npx shadcn@latest add @arbor/button`). The
      manifest publishes a registry version (26.0.1) but no per-item release date, so
      `published` is null: checked, nothing dated to record. See components/linktree-components.yml.
